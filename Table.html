<!DOCTYPE html/>
<head>
    <Title>HTML Table Example </Title>
</head>
<body>
    <table border ="1">
    <caption>student Grades</caption>
    <thead>
        
            <th>Name</th>
            <th>Subject</th>
            <th>Grade</th>
        
    </thead>
    <tbody>
    <tr>

        <tr>
    <tr>

<tfoot>
    <tr>
        <td colspan="3"> End Of Student Grades</td>
    </tr>

</tfoot>
</table>
<div><label for="email">Email:</label>
<input type="email" id="email" name="email" placeholder="Enter email"></div>
<div><label for="password">Password:</label>
<input type="password" id="password" name="password" placeholder="Enter password"></div>
<div><label for="phone">Phone:</label>
<input type="tel" id="phone" name="phone" placeholder="Enter phone number"></div>

<div>
     
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
</div>
<div> 
    <label for="checkbox">Subscribe to newsletter:</label>
    <input type="checkbox" id="checkbox" name="checkbox">
    <label for="skills">Skills:</label>
    <input type="text" id="skills" name="skills" placeholder="Enter skills"></div>


<div>
    <label for="country">Country:</label>
    <select id="country" name="country">
        <option value="usa">USA</option>
        <option value="canada">Canada</option>
        <option value="uk">UK</option>
        <option value="australia">Australia</option>
    </select>
<div> 
    <label for="radio" college>College:</label>
    <input type="radio" id="college1" name="college" value="college1">
    <label for="college1">mbu</label>
    <input type="radio" id="college2" name="college" value="college2">
    <label for="college2">mjr</label>
</div>
